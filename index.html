<!DOCTYPE html>
<html>
<head>
  <title>Signal Archive</title>

  <style>
    body {
      margin: 0;
      background: #050505;
      font-family: Arial, sans-serif;
      color: white;
    }

    .site-title {
      padding: 28px 40px 10px 40px;
      font-size: 16px;
      letter-spacing: 3px;
      opacity: 0.85;
    }

    .site-sub {
      padding: 0 40px 10px 40px;
      font-size: 12px;
      opacity: 0.45;
      letter-spacing: 1px;
    }

    .section-title {
      padding: 30px 40px 8px 40px;
      font-size: 12px;
      opacity: 0.6;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 30px;
      padding: 10px 40px 40px 40px;
    }

    .mash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 34px;
      padding: 10px 40px 50px 40px;
    }

    .item {
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
      opacity: 0.96;
    }

    .item:hover {
      transform: scale(1.03);
      opacity: 1;
    }

    .item img {
      width: 100%;
      display: block;
      border-radius: 6px;
      background: #111;
      box-shadow: 0 0 20px rgba(255,255,255,0.03);
    }

    .caption {
      font-size: 11px;
      opacity: 0.5;
      padding-top: 10px;
      letter-spacing: 0.5px;
    }

    .viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.96);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 999;
    }

    .viewer img {
      max-width: 90%;
      max-height: 82%;
      border-radius: 6px;
    }

    .viewer-caption {
      margin-top: 16px;
      font-size: 12px;
      opacity: 0.65;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 24px;
      cursor: pointer;
      opacity: 0.6;
    }

    .close:hover {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div class="site-title">SIGNAL ARCHIVE</div>
  <div class="site-sub">full archive, animated signals</div>

  <div class="section-title">Signal Works</div>
  <div class="mash-grid">

    <div class="item" onclick="openViewer('assets/buffer.gif', 'Buffer')">
      <img src="assets/buffer.gif" alt="Buffer">
      <div class="caption">Buffer</div>
    </div>

    <div class="item" onclick="openViewer('assets/gasto-march-21-26.gif', 'Gasto March 21 26')">
      <img src="assets/gasto-march-21-26.gif" alt="Gasto March 21 26">
      <div class="caption">Gasto March 21 26</div>
    </div>

    <div class="item" onclick="openViewer('assets/glori.gif', 'Glori')">
      <img src="assets/glori.gif" alt="Glori">
      <div class="caption">Glori</div>
    </div>

    <div class="item" onclick="openViewer('assets/ned.gif', 'Ned')">
      <img src="assets/ned.gif" alt="Ned">
      <div class="caption">Ned</div>
    </div>

    <div class="item" onclick="openViewer('assets/nod.gif', 'Nod')">
      <img src="assets/nod.gif" alt="Nod">
      <div class="caption">Nod</div>
    </div>

    <div class="item" onclick="openViewer('assets/nosfo.gif', 'Nosfo')">
      <img src="assets/nosfo.gif" alt="Nosfo">
      <div class="caption">Nosfo</div>
    </div>

    <div class="item" onclick="openViewer('assets/on-hold-gold.gif', 'On Hold Gold')">
      <img src="assets/on-hold-gold.gif" alt="On Hold Gold">
      <div class="caption">On Hold Gold</div>
    </div>

    <div class="item" onclick="openViewer('assets/on-hold.gif', 'On Hold')">
      <img src="assets/on-hold.gif" alt="On Hold">
      <div class="caption">On Hold</div>
    </div>

    <div class="item" onclick="openViewer('assets/pending-gold.gif', 'Pending Gold')">
      <img src="assets/pending-gold.gif" alt="Pending Gold">
      <div class="caption">Pending Gold</div>
    </div>

    <div class="item" onclick="openViewer('assets/pending-heli.gif', 'Pending Helicopter')">
      <img src="assets/pending-heli.gif" alt="Pending Helicopter">
      <div class="caption">Pending Helicopter</div>
    </div>

    <div class="item" onclick="openViewer('assets/pending1.gif', 'Pending 1')">
      <img src="assets/pending1.gif" alt="Pending 1">
      <div class="caption">Pending 1</div>
    </div>

    <div class="item" onclick="openViewer('assets/seep.gif', 'Seep')">
      <img src="assets/seep.gif" alt="Seep">
      <div class="caption">Seep</div>
    </div>

    <div class="item" onclick="openViewer('assets/seep-heli.gif', 'Seep Helicopter')">
      <img src="assets/seep-heli.gif" alt="Seep Helicopter">
      <div class="caption">Seep Helicopter</div>
    </div>

  </div>

  <div class="viewer" id="viewer" onclick="closeViewer()">
    <div class="close">✕</div>
    <img id="viewerImg" alt="">
    <div class="viewer-caption" id="viewerCaption"></div>
  </div>

  <script>
    function openViewer(src, caption) {
      document.getElementById('viewer').style.display = 'flex';
      document.getElementById('viewerImg').src = src;
      document.getElementById('viewerCaption').textContent = caption;
    }

    function closeViewer() {
      document.getElementById('viewer').style.display = 'none';
    }
  </script>

</body>
</html>
